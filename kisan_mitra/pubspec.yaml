name: kisan_mitra
description: "కిసాన్ మిత్ర (Kisan Mitra) - Farmer's Friend Voice-First Agriculture AI Assistant"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  provider: ^6.1.2
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0
  http: ^1.2.2
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
